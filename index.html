<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دنگ‌یار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دنگ‌یار">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-soft:#eef2ff;--green:#10b981;--red:#ef4444;--red-soft:#fef2f2;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
body{font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#eef2ff 0%,#f8fafc 260px,#f8fafc 100%);background-attachment:fixed;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding:0 0 48px;-webkit-tap-highlight-color:transparent}
.app{max-width:680px;margin:0 auto;padding:0 16px}
.header{padding:30px 0 18px;text-align:center}
.logo{font-size:27px;font-weight:800;line-height:1.2}
.logo span{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.summary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 12px 30px -12px rgba(99,102,241,.75);margin-bottom:18px}
.summary .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
.summary .val{font-size:21px;font-weight:800;white-space:nowrap}
.summary .val small{font-size:12px;font-weight:500;opacity:.85;margin-right:3px}
.summary .people-count{font-size:12.5px;background:rgba(255,255,255,.2);padding:7px 13px;border-radius:999px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px rgba(15,23,42,.07)}
.tab{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.tab.active{background:var(--primary-soft);color:var(--primary-dark)}
.panel{display:none}
.panel.active{display:block}
.btn{font-family:inherit;border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.18s}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px -8px rgba(99,102,241,.9)}
.btn.ghost{background:#f1f5f9;color:var(--text)}
.btn.block{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 10px}
.expense{background:#fff;border-radius:15px;padding:14px 15px;margin-bottom:10px;border:1px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05)}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.exp-title{font-size:15px;font-weight:700;line-height:1.45;word-break:break-word}
.exp-amt{font-size:15px;font-weight:800;color:var(--primary-dark);white-space:nowrap;flex-shrink:0}
.exp-amt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-right:3px}
.exp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:#f1f5f9;border-radius:8px;padding:5px 9px;font-size:11.5px;color:#475569;font-weight:500;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.tag.payer{background:var(--primary-soft);color:var(--primary-dark)}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-actions{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}
.mini{font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;background:#f1f5f9;color:#475569;border:0;cursor:pointer}
.mini.danger{background:var(--red-soft);color:#dc2626}
.person{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:9px;border:1px solid #f1f5f9;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.avatar{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7)}
.person .name{flex:1;font-weight:600;font-size:14.5px}
.icon-del{width:32px;height:32px;border-radius:9px;border:0;background:var(--red-soft);color:#dc2626;cursor:pointer;font-size:15px;line-height:1}
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row input{flex:1}
input[type=text]{width:100%;font-family:inherit;font-size:14.5px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;color:var(--text);outline:none;transition:.18s}
input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
input::placeholder{color:#94a3b8}
.bal-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border-radius:14px;margin-bottom:9px;border:1px solid #f1f5f9;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.bal-row .name{flex:1;font-weight:600;font-size:14.5px}
.bal-val{font-size:14px;font-weight:800;white-space:nowrap}
.bal-val.pos{color:var(--green)}
.bal-val.neg{color:var(--red)}
.bal-val.zero{color:#94a3b8;font-weight:600;font-size:12.5px}
.avatar.pos{background:linear-gradient(135deg,#10b981,#34d399)}
.avatar.neg{background:linear-gradient(135deg,#ef4444,#f87171)}
.avatar.zero{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
.settle-group{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05)}
.settle-group-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed #e2e8f0}
.settle-group-title{font-size:13px;color:#475569;line-height:1.5}
.settle-group-title b{color:var(--text);font-weight:700}
.settle-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f8fafc;border-radius:11px;margin-bottom:7px;border:1px solid #f1f5f9}
.settle-row:last-child{margin-bottom:0}
.settle-arrow{color:var(--red);font-size:18px;font-weight:800;flex-shrink:0}
.settle-text{flex:1;font-size:13px;line-height:1.6;color:#475569}
.settle-text b{color:var(--text);font-weight:700}
.settle-amt{font-size:13.5px;font-weight:800;color:var(--primary-dark);white-space:nowrap;flex-shrink:0}
.settle-amt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-right:3px}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.action-card{background:#fff;border-radius:15px;padding:16px 12px;border:1.5px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-family:inherit;transition:.2s;text-align:center;color:var(--text)}
.action-card .ac-icon{font-size:26px;line-height:1}
.action-card .ac-title{font-size:13px;font-weight:700}
.action-card .ac-desc{font-size:10.5px;color:var(--muted);line-height:1.5}
.action-card.success{border-color:#a7f3d0;background:linear-gradient(135deg,#ecfdf5,#f0fdf4)}
.action-card.success .ac-title{color:#059669}
.action-card.pdf{border-color:#c7d2fe;background:linear-gradient(135deg,#eef2ff,#f5f3ff)}
.action-card.pdf .ac-title{color:var(--primary-dark)}
.action-card.backup{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.action-card.backup .ac-title{color:#b45309}
.action-card.restore{border-color:#ddd6fe;background:linear-gradient(135deg,#f5f3ff,#ede9fe)}
.action-card.restore .ac-title{color:#7c3aed}
.action-card.warning{border-color:#fecaca;background:linear-gradient(135deg,#fef2f2,#fff1f2)}
.action-card.warning .ac-title{color:#dc2626}
.empty{text-align:center;padding:44px 20px;color:var(--muted);background:#fff;border-radius:16px;border:1.5px dashed #e2e8f0}
.empty .ico{font-size:36px;margin-bottom:12px;opacity:.7}
.empty .t{font-size:14px;font-weight:600;color:#475569;margin-bottom:5px}
.empty .d{font-size:12.5px;line-height:1.7}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:100%;max-width:680px;border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:26px}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #f1f5f9;flex-shrink:0}
.modal-header h2{font-size:16.5px;font-weight:800;margin:0}
.close-btn{width:34px;height:34px;border-radius:10px;border:0;background:#f1f5f9;color:#64748b;font-size:16px;cursor:pointer;line-height:1}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-footer{display:flex;gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #f1f5f9;flex-shrink:0}
.modal-footer .btn{flex:1}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:8px}
.field label .req{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;transition:.15s}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.hint-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hint-row label{margin-bottom:0}
.link-btn{background:none;border:0;font-family:inherit;font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;padding:2px 4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:inherit;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.offline-bar{position:fixed;top:0;left:0;right:0;z-index:400;background:#f59e0b;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px;transform:translateY(-100%);transition:.3s;pointer-events:none}
.offline-bar.show{transform:translateY(0)}
#pdfContainer{position:fixed;top:0;left:0;width:794px;min-width:794px;max-width:794px;background:#fff;direction:rtl;font-family:'Vazirmatn',Tahoma,sans-serif;color:#1e293b;padding:0;box-sizing:border-box;display:none;z-index:-9999;pointer-events:none}
#pdfContainer.active{display:block}
.pdf-loading-overlay{position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:15px;font-weight:700;flex-direction:column;gap:14px}
.pdf-loading-overlay .spinner{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:pdfspin .8s linear infinite}
@keyframes pdfspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="offline-bar" id="offlineBar">⚠️ حالت آفلاین</div>

<div class="app">
<div class="header">
<div class="logo">دنگ<span>‌یار</span></div>
<div class="sub">محاسبه‌ی دقیق دنگ و تسویه‌حساب</div>
</div>

<div class="summary">
<div>
<div class="lbl">جمع کل هزینه‌ها</div>
<div class="val" id="totalAmount">۰ <small>تومان</small></div>
</div>
<div class="people-count" id="peopleCount">۰ نفر</div>
</div>

<div class="tabs">
<button type="button" class="tab active" data-action="tab" data-tab="expenses">هزینه‌ها</button>
<button type="button" class="tab" data-action="tab" data-tab="people">افراد</button>
<button type="button" class="tab" data-action="tab" data-tab="settle">تسویه</button>
</div>

<div class="panel active" id="panel-expenses">
<button type="button" class="btn primary block" data-action="open-add-expense" style="margin-bottom:16px">＋ افزودن هزینه</button>
<div id="expensesList"></div>
</div>

<div class="panel" id="panel-people">
<div class="add-row">
<input type="text" id="personName" placeholder="نام شخص" autocomplete="off">
<button type="button" class="btn primary" data-action="add-person">افزودن</button>
</div>
<div id="peopleList"></div>
</div>

<div class="panel" id="panel-settle">
<div class="section-title">📊 وضعیت هر نفر</div>
<div id="balancesList"></div>
<div class="section-title">🤝 راه‌حل تسویه</div>
<div id="settlementsList"></div>
<div class="section-title">⚡ عملیات</div>
<div class="actions-grid">
<button type="button" class="action-card pdf" data-action="export-pdf"><span class="ac-icon">📄</span><span class="ac-title">خروجی PDF</span><span class="ac-desc">تراکنش‌ها + تسویه</span></button>
<button type="button" class="action-card success" data-action="settle-done"><span class="ac-icon">✅</span><span class="ac-title">تسویه شد</span><span class="ac-desc">پاک کردن تراکنش‌ها</span></button>
<button type="button" class="action-card backup" data-action="export-backup"><span class="ac-icon">💾</span><span class="ac-title">پشتیبان‌گیری</span><span class="ac-desc">ذخیره JSON</span></button>
<button type="button" class="action-card restore" data-action="import-backup"><span class="ac-icon">📥</span><span class="ac-title">بازگردانی</span><span class="ac-desc">بارگذاری پشتیبان</span></button>
<button type="button" class="action-card warning" data-action="reset-all" style="grid-column:1/-1"><span class="ac-icon">🗑</span><span class="ac-title">پاک کردن همه‌ی داده‌ها</span><span class="ac-desc">حذف افراد و هزینه‌ها</span></button>
</div>
<input type="file" id="backupFile" accept=".json,application/json" style="display:none">
</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
<div class="modal" role="dialog">
<div class="modal-header">
<h2 id="modalTitle">افزودن هزینه</h2>
<button type="button" class="close-btn" data-action="close-modal">✕</button>
</div>
<div class="modal-body">
<div class="field"><label>عنوان هزینه <span class="req">*</span></label><input type="text" id="expTitle" placeholder="مثلاً شام" autocomplete="off"></div>
<div class="field"><label>مبلغ (تومان) <span class="req">*</span></label><input type="text" id="expAmount" inputmode="numeric" placeholder="۰" autocomplete="off"></div>
<div class="field"><label>چه کسی خرج کرده؟ <span class="req">*</span></label><div class="chips" id="payerChips"></div></div>
<div class="field">
<div class="hint-row"><label>برای چه کسانی خرج شده؟ <span class="req">*</span></label><button type="button" class="link-btn" data-action="toggle-all" id="toggleAll">انتخاب همه</button></div>
<div class="chips" id="benChips"></div>
</div>
</div>
<div class="modal-footer">
<button type="button" class="btn ghost" data-action="close-modal">انصراف</button>
<button type="button" class="btn primary" data-action="save-expense">ذخیره</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>
<div id="pdfContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
'use strict';
var STORAGE_KEY='dongyar_v1';
var people=[],expenses=[],editingExpenseId=null,modalPayerId=null,modalBenIds=new Set();

function qs(s){return document.querySelector(s)}
function qsa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function uid(){return 'id_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function money(n){try{return new Intl.NumberFormat('fa-IR').format(Math.round(Number(n)||0))}catch(e){return String(Math.round(Number(n)||0))}}
function findPerson(id){for(var i=0;i<people.length;i++)if(people[i].id===id)return people[i];return null}
function personName(id){var p=findPerson(id);return p?p.name:'نامشخص'}
function personIndex(id){for(var i=0;i<people.length;i++)if(people[i].id===id)return i;return 999999}
function firstChar(n){var t=String(n||'').trim();return (t.charAt(0)||'؟').toUpperCase()}
function todayFa(){try{return new Date().toLocaleDateString('fa-IR')}catch(e){return new Date().toISOString().slice(0,10)}}
function fileStamp(){var d=new Date();function p(n){return n<10?'0'+n:''+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())}

function requestPersistentStorage(){
  if(!navigator.storage||!navigator.storage.persist)return;
  navigator.storage.persisted().then(function(a){if(!a)navigator.storage.persist()}).catch(function(){});
}

function loadState(){try{var r=localStorage.getItem(STORAGE_KEY);if(r){var d=JSON.parse(r);people=Array.isArray(d.people)?d.people:[];expenses=Array.isArray(d.expenses)?d.expenses:[]}}catch(e){}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({people:people,expenses:expenses}))}catch(e){}}

var toastTimer;
function showToast(m){var el=qs('#toast');if(!el)return;el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2400)}

function switchTab(n){qsa('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')===n)});qsa('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+n)})}

function computeBalances(){var b={};people.forEach(function(p){b[p.id]=0});expenses.forEach(function(e){var bens=(e.beneficiaryIds||[]).filter(function(id){return id in b});if(!bens.length)return;if(e.payerId in b)b[e.payerId]+=Number(e.amount)||0;var sh=(Number(e.amount)||0)/bens.length;bens.forEach(function(id){b[id]-=sh})});return b}

function computeSettlements(){var debts={};expenses.forEach(function(e){var bens=(e.beneficiaryIds||[]);if(!bens.length)return;var sh=(Number(e.amount)||0)/bens.length;if(sh<=0)return;bens.forEach(function(bi){if(bi===e.payerId)return;var k=bi+'|'+e.payerId;debts[k]=(debts[k]||0)+sh})});var res=[],seen={};Object.keys(debts).forEach(function(k){var p=k.split('|'),a=p[0],b=p[1];var pk=a<b?(a+'||'+b):(b+'||'+a);if(seen[pk])return;seen[pk]=true;var ab=debts[a+'|'+b]||0,ba=debts[b+'|'+a]||0;var net=ab-ba;if(net>0.5)res.push({from:a,to:b,amount:net});else if(net<-0.5)res.push({from:b,to:a,amount:-net})});return res}

function renderSummary(){var t=expenses.reduce(function(s,e){return s+(Number(e.amount)||0)},0);qs('#totalAmount').innerHTML=money(t)+' <small>تومان</small>';qs('#peopleCount').textContent=money(people.length)+' نفر'}
