<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دنگ‌یار | محاسبه دنگ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دنگ‌یار">
<meta name="application-name" content="دنگ‌یار">
<meta name="description" content="محاسبه‌ی دقیق دنگ و تسویه‌حساب">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --primary:#6366f1; --primary-dark:#4f46e5; --primary-soft:#eef2ff;
    --green:#10b981; --red:#ef4444; --red-soft:#fef2f2;
    --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
  }
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(180deg,#eef2ff 0%,#f8fafc 260px,#f8fafc 100%);
    background-attachment:fixed; color:var(--text); min-height:100vh;
    -webkit-font-smoothing:antialiased; padding:0 0 48px;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:680px;margin:0 auto;padding:0 16px}
  .header{padding:30px 0 18px;text-align:center}
  .logo{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
  .logo span{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
  .summary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;
    align-items:center;gap:14px;box-shadow:0 12px 30px -12px rgba(99,102,241,.75);
    margin-bottom:18px;
  }
  .summary .lbl{font-size:12px;opacity:.85;margin-bottom:4px}
  .summary .val{font-size:21px;font-weight:800;white-space:nowrap}
  .summary .val small{font-size:12px;font-weight:500;opacity:.85;margin-right:3px}
  .summary .people-count{
    font-size:12.5px;background:rgba(255,255,255,.2);padding:7px 13px;
    border-radius:999px;font-weight:600;white-space:nowrap;
  }
  .tabs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px rgba(15,23,42,.07)}
  .tab{
    flex:1;border:0;background:transparent;padding:11px 6px;border-radius:10px;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    cursor:pointer;transition:.2s;user-select:none;
  }
  .tab.active{background:var(--primary-soft);color:var(--primary-dark)}
  .panel{display:none}
  .panel.active{display:block}
  .btn{
    font-family:inherit;border:0;border-radius:12px;padding:12px 18px;
    font-size:14px;font-weight:700;cursor:pointer;transition:.18s;user-select:none;
  }
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px -8px rgba(99,102,241,.9)}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.ghost{background:#f1f5f9;color:var(--text)}
  .btn.ghost:hover{background:#e2e8f0}
  .btn.block{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 10px}
  .expense{
    background:#fff;border-radius:15px;padding:14px 15px;margin-bottom:10px;
    border:1px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05);
  }
  .exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .exp-title{font-size:15px;font-weight:700;line-height:1.45;word-break:break-word}
  .exp-amt{font-size:15px;font-weight:800;color:var(--primary-dark);white-space:nowrap;flex-shrink:0}
  .exp-amt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-right:3px}
  .exp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{
    background:#f1f5f9;border-radius:8px;padding:5px 9px;font-size:11.5px;
    color:#475569;font-weight:500;display:inline-flex;align-items:center;gap:4px;max-width:100%;
  }
  .tag.payer{background:var(--primary-soft);color:var(--primary-dark)}
  .tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp-actions{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}
  .mini{
    font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;
    border-radius:9px;background:#f1f5f9;color:#475569;border:0;cursor:pointer;
  }
  .mini:hover{background:#e2e8f0}
  .mini.danger{background:var(--red-soft);color:#dc2626}
  .mini.danger:hover{background:#fee2e2}
  .person{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
    padding:12px 14px;margin-bottom:9px;border:1px solid #f1f5f9;
    box-shadow:0 2px 10px rgba(15,23,42,.04);
  }
  .avatar{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;
    background:linear-gradient(135deg,#6366f1,#a855f7);
  }
  .person .name{flex:1;font-weight:600;font-size:14.5px}
  .icon-del{
    width:32px;height:32px;border-radius:9px;border:0;background:var(--red-soft);
    color:#dc2626;cursor:pointer;font-size:15px;line-height:1;
  }
  .icon-del:hover{background:#fee2e2}
  .add-row{display:flex;gap:8px;margin-bottom:16px}
  .add-row input{flex:1}
  input[type=text]{
    width:100%;font-family:inherit;font-size:14.5px;padding:13px 14px;
    border-radius:12px;border:1.5px solid var(--border);background:#fff;
    color:var(--text);outline:none;transition:.18s;
  }
  input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
  input::placeholder{color:#94a3b8}
  .bal-row{
    display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;
    border-radius:14px;margin-bottom:9px;border:1px solid #f1f5f9;
    box-shadow:0 2px 10px rgba(15,23,42,.04);
  }
  .bal-row .name{flex:1;font-weight:600;font-size:14.5px}
  .bal-val{font-size:14px;font-weight:800;white-space:nowrap}
  .bal-val.pos{color:var(--green)}
  .bal-val.neg{color:var(--red)}
  .bal-val.zero{color:#94a3b8;font-weight:600;font-size:12.5px}
  .avatar.pos{background:linear-gradient(135deg,#10b981,#34d399)}
  .avatar.neg{background:linear-gradient(135deg,#ef4444,#f87171)}
  .avatar.zero{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}

  .settle-group {
    background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;
    border:1px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05);
  }
  .settle-group-head{
    display:flex;align-items:center;gap:10px;padding-bottom:10px;
    margin-bottom:10px;border-bottom:1px dashed #e2e8f0;
  }
  .settle-group-title{font-size:13px;color:#475569;line-height:1.5}
  .settle-group-title b{color:var(--text);font-weight:700}
  .settle-row{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    background:#f8fafc;border-radius:11px;margin-bottom:7px;
    border:1px solid #f1f5f9;
  }
  .settle-row:last-child{margin-bottom:0}
  .settle-arrow{color:var(--red);font-size:18px;font-weight:800;flex-shrink:0}
  .settle-text{flex:1;font-size:13px;line-height:1.6;color:#475569}
  .settle-text b{color:var(--text);font-weight:700}
  .settle-amt{
    font-size:13.5px;font-weight:800;color:var(--primary-dark);
    white-space:nowrap;flex-shrink:0;
  }
  .settle-amt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-right:3px}

  .actions-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;
  }
  .action-card{
    background:#fff;border-radius:15px;padding:16px 12px;
    border:1.5px solid #f1f5f9;box-shadow:0 2px 12px rgba(15,23,42,.05);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    cursor:pointer;font-family:inherit;transition:.2s;text-align:center;
    color:var(--text);
  }
  .action-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(15,23,42,.1)}
  .action-card:active{transform:translateY(0)}
  .action-card .ac-icon{font-size:26px;line-height:1}
  .action-card .ac-title{font-size:13px;font-weight:700}
  .action-card .ac-desc{font-size:10.5px;color:var(--muted);line-height:1.5}
  .action-card.success{border-color:#a7f3d0;background:linear-gradient(135deg,#ecfdf5,#f0fdf4)}
  .action-card.success .ac-title{color:#059669}
  .action-card.pdf{border-color:#c7d2fe;background:linear-gradient(135deg,#eef2ff,#f5f3ff)}
  .action-card.pdf .ac-title{color:var(--primary-dark)}
  .action-card.backup{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
  .action-card.backup .ac-title{color:#b45309}
  .action-card.restore{border-color:#ddd6fe;background:linear-gradient(135deg,#f5f3ff,#ede9fe)}
  .action-card.restore .ac-title{color:#7c3aed}
  .action-card.warning{border-color:#fecaca;background:linear-gradient(135deg,#fef2f2,#fff1f2)}
  .action-card.warning .ac-title{color:#dc2626}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);background:#fff;border-radius:16px;border:1.5px dashed #e2e8f0}
  .empty .ico{font-size:36px;margin-bottom:12px;opacity:.7}
  .empty .t{font-size:14px;font-weight:600;color:#475569;margin-bottom:5px}
  .empty .d{font-size:12.5px;line-height:1.7}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.55);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .modal-backdrop.open{display:flex}
  .modal{
    background:#fff;width:100%;max-width:680px;border-radius:26px 26px 0 0;
    max-height:92vh;display:flex;flex-direction:column;
    animation:slideUp .3s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes popIn{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  @media(min-width:640px){
    .modal-backdrop{align-items:center;padding:20px}
    .modal{border-radius:26px;animation:popIn .25s ease}
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #f1f5f9;flex-shrink:0}
  .modal-header h2{font-size:16.5px;font-weight:800;margin:0}
  .close-btn{width:34px;height:34px;border-radius:10px;border:0;background:#f1f5f9;color:#64748b;font-size:16px;cursor:pointer;line-height:1}
  .close-btn:hover{background:#e2e8f0}
  .modal-body{padding:18px 20px;overflow-y:auto;flex:1}
  .modal-footer{display:flex;gap:10px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #f1f5f9;flex-shrink:0}
  .modal-footer .btn{flex:1}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:8px}
  .field label .req{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:9px 15px;border-radius:999px;border:1.5px solid var(--border);background:#fff;
    font-family:inherit;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:#c7d2fe}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(99,102,241,.9)}
  .hint-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hint-row label{margin-bottom:0}
  .link-btn{background:none;border:0;font-family:inherit;font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;padding:2px 4px}
  .link-btn:hover{text-decoration:underline}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1e293b;color:#fff;font-size:13px;font-weight:600;padding:12px 20px;
    border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:300;
    box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:inherit;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .offline-bar{
    position:fixed;top:0;left:0;right:0;z-index:400;
    background:#f59e0b;color:#fff;text-align:center;
    font-size:12px;font-weight:700;padding:6px;
    transform:translateY(-100%);transition:.3s;
    pointer-events:none;
  }
  .offline-bar.show{transform:translateY(0)}

  #pdfContainer{
    position: fixed;top:0;left:0;
    width:794px;min-width:794px;max-width:794px;
    background:#ffffff;direction:rtl;
    font-family:'Vazirmatn',Tahoma,sans-serif;color:#1e293b;
    padding:0;box-sizing:border-box;
    display:none;z-index:-9999;pointer-events:none;
  }
  #pdfContainer.active{display:block}

  .pdf-loading-overlay{
    position:fixed;inset:0;z-index:99999;
    background:rgba(15,23,42,.85);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Vazirmatn',sans-serif;
    font-size:15px;font-weight:700;flex-direction:column;gap:14px;
  }
  .pdf-loading-overlay .spinner{
    width:38px;height:38px;border-radius:50%;
    border:4px solid rgba(255,255,255,.25);
    border-top-color:#fff;
    animation:pdfspin 0.8s linear infinite;
  }
  @keyframes pdfspin{to{transform:rotate(360deg)}}

  @media print{
    body{background:#fff}
    .app,.toast,.modal-backdrop,.pdf-loading-overlay,.offline-bar{display:none !important}
  }
</style>
</head>
<body>

<div class="offline-bar" id="offlineBar">⚠️ حالت آفلاین — داده‌ها ذخیره می‌شوند</div>

<div class="app">
  <div class="header">
    <div class="logo">دنگ<span>‌یار</span></div>
    <div class="sub">محاسبه‌ی دقیق دنگ و تسویه‌حساب</div>
  </div>

  <div class="summary">
    <div>
      <div class="lbl">جمع کل هزینه‌ها</div>
      <div class="val" id="totalAmount">۰ <small>تومان</small></div>
    </div>
    <div class="people-count" id="peopleCount">۰ نفر</div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-action="tab" data-tab="expenses">هزینه‌ها</button>
    <button type="button" class="tab" data-action="tab" data-tab="people">افراد</button>
    <button type="button" class="tab" data-action="tab" data-tab="settle">تسویه</button>
  </div>

  <div class="panel active" id="panel-expenses">
    <button type="button" class="btn primary block" data-action="open-add-expense" style="margin-bottom:16px">
      <span style="font-size:17px;line-height:1">＋</span> افزودن هزینه
    </button>
    <div id="expensesList"></div>
  </div>

  <div class="panel" id="panel-people">
    <div class="add-row">
      <input type="text" id="personName" placeholder="نام شخص (مثلاً علی)" autocomplete="off" spellcheck="false">
      <button type="button" class="btn primary" data-action="add-person">افزودن</button>
    </div>
    <div id="peopleList"></div>
  </div>

  <div class="panel" id="panel-settle">
    <div class="section-title">📊 وضعیت هر نفر</div>
    <div id="balancesList"></div>
    <div class="section-title">🤝 راه‌حل تسویه</div>
    <div id="settlementsList"></div>

    <div class="section-title">⚡ عملیات</div>
    <div class="actions-grid">
      <button type="button" class="action-card pdf" data-action="export-pdf">
        <span class="ac-icon">📄</span>
        <span class="ac-title">خروجی PDF</span>
        <span class="ac-desc">تراکنش‌ها + تسویه</span>
      </button>
      <button type="button" class="action-card success" data-action="settle-done">
        <span class="ac-icon">✅</span>
        <span class="ac-title">تسویه شد</span>
        <span class="ac-desc">پاک کردن تراکنش‌ها</span>
      </button>
      <button type="button" class="action-card backup" data-action="export-backup">
        <span class="ac-icon">💾</span>
        <span class="ac-title">پشتیبان‌گیری</span>
        <span class="ac-desc">ذخیره در فایل JSON</span>
      </button>
      <button type="button" class="action-card restore" data-action="import-backup">
        <span class="ac-icon">📥</span>
        <span class="ac-title">بازگردانی</span>
        <span class="ac-desc">بارگذاری پشتیبان</span>
      </button>
      <button type="button" class="action-card warning" data-action="reset-all" style="grid-column:1/-1">
        <span class="ac-icon">🗑</span>
        <span class="ac-title">پاک کردن همه‌ی داده‌ها</span>
        <span class="ac-desc">افراد و هزینه‌ها حذف می‌شوند</span>
      </button>
    </div>

    <input type="file" id="backupFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modalTitle">افزودن هزینه</h2>
      <button type="button" class="close-btn" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>عنوان هزینه <span class="req">*</span></label>
        <input type="text" id="expTitle" placeholder="مثلاً شام رستوران" autocomplete="off">
      </div>
      <div class="field">
        <label>مبلغ (تومان) <span class="req">*</span></label>
        <input type="text" id="expAmount" inputmode="numeric" placeholder="۰" autocomplete="off">
      </div>
      <div class="field">
        <label>چه کسی خرج کرده؟ <span class="req">*</span></label>
        <div class="chips" id="payerChips"></div>
      </div>
      <div class="field">
        <div class="hint-row">
          <label>برای چه کسانی خرج شده؟ <span class="req">*</span></label>
          <button type="button" class="link-btn" data-action="toggle-all" id="toggleAll">انتخاب همه</button>
        </div>
        <div class="chips" id="benChips"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn ghost" data-action="close-modal">انصراف</button>
      <button type="button" class="btn primary" data-action="save-expense">ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="pdfContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'dongyar_v1';
  var people = [];
  var expenses = [];
  var editingExpenseId = null;
  var modalPayerId = null;
  var modalBenIds = new Set();

  function qs(sel) { return document.querySelector(sel); }
  function qsa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function uid() { return 'id_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function money(n) {
    try { return new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0)); }
    catch (e) { return String(Math.round(Number(n) || 0)); }
  }
  function findPerson(id) {
    for (var i = 0; i < people.length; i++) if (people[i].id === id) return people[i];
    return null;
  }
  function personName(id) {
    var p = findPerson(id);
    return p ? p.name : 'نامشخص';
  }
  function personIndex(id) {
    for (var i = 0; i < people.length; i++) if (people[i].id === id) return i;
    return 999999;
  }
  function firstChar(name) {

  function todayFa() {

  function fileStamp() {
    var d = new Date();
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           '-' + pad(d.getHours()) + pad(d.getMinutes());

  async function requestPersistentStorage() {
    if (!navigator.storage || !navigator.storage.persist) {
      console.log('Persistent Storage پشتیبانی نمی‌شود');
      return false;
    }
    try {
      var already = await navigator.storage.persisted();
      if (already) {
        console.log('✓ حافظه‌ی پایدار از قبل فعال بود');
        return true;
      }
      var granted = await navigator.storage.persist();
      console.log('حافظه‌ی پایدار:', granted ? '✓ فعال شد' : '✗ رد شد');
      return granted;
    } catch (e) {
      console.warn('Persistent storage error:', e);
      return false;
    }
  }

        expenses = Array.isArray(data.expenses) ? data.expenses : [];

  var toastTimer;

  function switchTab(name) {

  function computeBalances() {
    var bal = {};
    people.forEach(function (p) { bal[p.id] = 0; });
    expenses.forEach(function (e) {
      var bens = (e.beneficiaryIds || []).filter(function (id) { return id in bal; });
      if (!bens.length) return;
      if (e.payerId in bal) bal[e.payerId] += Number(e.amount) || 0;
      var share = (Number(e.amount) || 0) / bens.length;
      bens.forEach(function (id) { bal[id] -= share; });
    });
    return bal;
  }

  function computeSettlements() {
    var debts = {};
    expenses.forEach(function (e) {
      var bens = (e.beneficiaryIds || []);
      if (!bens.length) return;
      var share = (Number(e.amount) || 0) / bens.length;
      if (share <= 0) return;
      bens.forEach(function (benId) {
        if (benId === e.payerId) return;
        var key = benId + '|' + e.payerId;
        debts[key] = (debts[key] || 0) + share;
      });
    });
    var result = [];
    var seen = {};
    Object.keys(debts).forEach(function (key) {
      var parts = key.split('|');
      var a = parts[0], b = parts[1];
      var pairKey = a < b ? (a + '||' + b) : (b + '||' + a);
      if (seen[pairKey]) return;
      seen[pairKey] = true;
      var ab = debts[a + '|' + b] || 0;
      var ba = debts[b + '|' + a] || 0;
      var net = ab - ba;
      if (net > 0.5) result.push({ from: a, to: b, amount: net });
      else if (net < -0.5) result.push({ from: b, to: a, amount: -net });
    });
    return result;
  }

  function renderSettle() {
    var balEl = qs('#balancesList');
    var setEl = qs('#settlementsList');

    if (!people.length) {
      balEl.innerHTML = '<div class="empty"><div class="ico">⚖️</div>' +
        '<div class="t">اطلاعاتی برای محاسبه نیست</div>' +
        '<div class="d">ابتدا افراد و هزینه‌ها را وارد کنید</div></div>';
      setEl.innerHTML = '';
      return;
    }

    var bal = computeBalances();

    balEl.innerHTML = people.map(function (p) {
      var v = bal[p.id] || 0;
      var cls = 'zero', txt = 'تسویه';
      if (v > 0.5) { cls = 'pos'; txt = money(v) + ' تومان طلب'; }
      else if (v < -0.5) { cls = 'neg'; txt = money(-v) + ' تومان بدهی'; }
      return '<div class="bal-row">' +
        '<div class="avatar ' + cls + '">' + esc(firstChar(p.name)) + '</div>' +
        '<div class="name">' + esc(p.name) + '</div>' +
        '<div class="bal-val ' + cls + '">' + txt + '</div>' +
      '</div>';
    }).join('');

    if (!expenses.length) {
      setEl.innerHTML = '<div class="empty"><div class="ico">🧮</div>' +
        '<div class="t">هزینه‌ای ثبت نشده</div>' +
        '<div class="d">پس از ثبت هزینه، تسویه اینجا نمایش داده می‌شود</div></div>';
      return;
    }

    var settlements = computeSettlements();

    if (!settlements.length) {
      setEl.innerHTML = '<div class="empty"><div class="ico">✅</div>' +
        '<div class="t">همه‌چیز تسویه است!</div>' +
        '<div class="d">هیچ‌کس بدهکار نیست</div></div>';
      return;
    }

    var grouped = {}, order = [];
    settlements.forEach(function (s) {
      if (!grouped[s.from]) { grouped[s.from] = []; order.push(s.from); }
      grouped[s.from].push(s);
    });

    order.sort(function (a, b) {
      return personIndex(a) - personIndex(b);
    });

    order.forEach(function (did) {
      grouped[did].sort(function (a, b) {
        return personIndex(a.to) - personIndex(b.to);
      });
    });

    var html = '';
    order.forEach(function (debtorId) {
      var items = grouped[debtorId];
      var total = items.reduce(function (sum, it) { return sum + it.amount; }, 0);

      html += '<div class="settle-group">' +
        '<div class="settle-group-head">' +
          '<div class="avatar neg">' + esc(firstChar(personName(debtorId))) + '</div>' +
          '<div class="settle-group-title">' +
            '<b>' + esc(personName(debtorId)) + '</b> باید ' + money(total) + ' تومان بدهد:' +
          '</div>' +
        '</div>';

      items.forEach(function (s) {
        html += '<div class="settle-row">' +
          '<div class="settle-arrow">←</div>' +
          '<div class="settle-text">به <b>' + esc(personName(s.to)) + '</b> بدهکار است</div>' +
          '<div class="settle-amt">' + money(s.amount) + '<small>تومان</small></div>' +
        '</div>';
      });

      html += '</div>';
    });

    setEl.innerHTML = html;
  }

  function openModal(expenseId) {
    editingExpenseId = expenseId || null;

    if (!people.length) {
      showToast('اول باید حداقل یک نفر اضافه کنید');
      switchTab('people');
      setTimeout(function () {
        var inp = qs('#personName');
        if (inp) inp.focus();
      }, 350);
      return;
    }

    if (editingExpenseId) {
      var e = null;
      for (var i = 0; i < expenses.length; i++) {
        if (expenses[i].id === editingExpenseId) { e = expenses[i]; break; }
      }
      if (!e) return;
      qs('#modalTitle').textContent = 'ویرایش هزینه';
      qs('#expTitle').value = e.title || '';
      qs('#expAmount').value = e.amount ? Number(e.amount).toLocaleString('en-US') : '';
      modalPayerId = e.payerId;
      modalBenIds = new Set(e.beneficiaryIds || []);
    } else {
      qs('#modalTitle').textContent = 'افزودن هزینه';
      qs('#expTitle').value = '';
      qs('#expAmount').value = '';
      modalPayerId = null;
      modalBenIds = new Set();
    }

    renderChips();
    qs('#modalBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { qs('#expTitle').focus(); }, 300);
  }

  function closeModal() {
    qs('#modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
    editingExpenseId = null;
  }

  function addPerson() {
    var input = qs('#personName');
    var name = (input.value || '').trim();
    if (!name) { input.focus(); return; }
    var dup = people.some(function (p) { return p.name.trim() === name; });
    if (dup) { showToast('این نام قبلاً اضافه شده'); return; }
    people.push({ id: uid(), name: name });
    input.value = '';
    input.focus();
    saveState();
    renderAll();
    showToast('«' + name + '» اضافه شد');
  }

  function deletePerson(id) {
    var used = expenses.some(function (e) {
      return e.payerId === id || (e.beneficiaryIds || []).indexOf(id) !== -1;
    });
    if (used) { showToast('این شخص در هزینه‌ها استفاده شده است'); return; }
    if (!confirm('این شخص حذف شود؟')) return;
    people = people.filter(function (p) { return p.id !== id; });
    saveState();
    renderAll();
    showToast('شخص حذف شد');
  }

  function deleteExpense(id) {
    if (!confirm('این هزینه حذف شود؟')) return;
    expenses = expenses.filter(function (e) { return e.id !== id; });
    saveState();
    renderAll();
    showToast('هزینه حذف شد');
  }

  function saveExpense() {
    var title = (qs('#expTitle').value || '').trim();
    var raw = (qs('#expAmount').value || '').replace(/[^\d]/g, '');
    var amount = parseInt(raw, 10);
    var benIds = people.filter(function (p) { return modalBenIds.has(p.id); })
                       .map(function (p) { return p.id; });

    if (!title) { showToast('عنوان هزینه را وارد کنید'); qs('#expTitle').focus(); return; }
    if (!amount || amount <= 0) { showToast('مبلغ معتبر وارد کنید'); qs('#expAmount').focus(); return; }
    if (!modalPayerId) { showToast('مشخص کنید چه کسی خرج کرده'); return; }
    if (!benIds.length) { showToast('حداقل یک نفر را انتخاب کنید'); return; }

    if (editingExpenseId) {
      for (var i = 0; i < expenses.length; i++) {
        if (expenses[i].id === editingExpenseId) {
          expenses[i].title = title;
          expenses[i].amount = amount;
          expenses[i].payerId = modalPayerId;
          expenses[i].beneficiaryIds = benIds;
          break;
        }
      }
      showToast('هزینه ویرایش شد');
    } else {
      expenses.unshift({
        id: uid(), title: title, amount: amount,
        payerId: modalPayerId, beneficiaryIds: benIds, createdAt: Date.now()
      });
      showToast('هزینه ثبت شد');
    }

    saveState();
    renderAll();
    closeModal();
  }

  function settleDone() {
    if (!expenses.length) {
      showToast('تراکنشی برای پاک کردن وجود ندارد');
      return;
    }
    var count = expenses.length;
    if (!confirm('همه‌ی ' + count + ' تراکنش پاک شوند؟ (افراد باقی می‌مانند)\n\nپیشنهاد: قبل از پاک کردن، از پشتیبان‌گیری استفاده کنید.')) return;
    expenses = [];
    saveState();
    renderAll();
    showToast('✓ تسویه شد — ' + money(count) + ' تراکنش پاک شد');
  }

  function exportBackup() {
    if (!people.length && !expenses.length) {
      showToast('داده‌ای برای پشتیبان‌گیری وجود ندارد');
      return;
    }
    var data = {
      app: 'dongyar', version: 1,
      exportedAt: new Date().toISOString(),
      people: people, expenses: expenses
    };
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'dongyar-backup-' + fileStamp() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast('💾 پشتیبان دانلود شد');
    } catch (e) {
      console.error(e);
      showToast('خطا در ساخت فایل پشتیبان');
    }
  }

  function importBackup(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('حجم فایل بیش از حد مجاز است');
      return;
    }
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data || typeof data !== 'object') throw new Error('ساختار فایل معتبر نیست');
        if (!Array.isArray(data.people) || !Array.isArray(data.expenses)) {
          throw new Error('فایل پشتیبان معتبر نیست');
        }
        var validPeople = data.people.every(function (p) { return p && p.id && p.name; });
        var validExpenses = data.expenses.every(function (e) {
          return e && e.id && e.payerId && Array.isArray(e.beneficiaryIds) && typeof e.amount === 'number';
        });
        if (!validPeople || !validExpenses) throw new Error('داده‌های فایل خراب است');

        if (!confirm('داده‌های فعلی (' + people.length + ' نفر، ' + expenses.length + ' تراکنش) با پشتیبان (' +
                     data.people.length + ' نفر، ' + data.expenses.length + ' تراکنش) جایگزین شوند؟')) return;

        people = data.people;
        expenses = data.expenses;
        saveState();
        renderAll();
        showToast('✓ پشتیبان بازگردانی شد');
      } catch (err) {
        console.error(err);
        showToast('خطا: ' + err.message);
      }
    };
    reader.onerror = function () { showToast('خطا در خواندن فایل'); };
    reader.readAsText(file);
  }

  function resetAll() {
    if (!confirm('همه‌ی افراد و هزینه‌ها حذف شوند؟ این کار قابل بازگشت نیست.')) return;
    people = []; expenses = [];
    saveState();
    renderAll();
    showToast('همه‌ی داده‌ها پاک شد');
  }

        html += '<span style="font-size:12.5px;color:#64748b;font-weight:500;"> بپردازد</span>';
        html += '</div>';

        html += '<table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;">';
        html += '<thead><tr style="background:#f8fafc;">';
        html += '<th style="padding:9px 16px;text-align:right;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0;font-size:11.5px;">به</th>';
        html += '<th style="padding:9px 16px;text-align:left;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0;font-size:11.5px;width:130px;">مبلغ (تومان)</th>';
        html += '</tr></thead><tbody>';
        items.forEach(function (s, idx) {
          var last = idx === items.length - 1;
          var bb = last ? '' : 'border-bottom:1px solid #f1f5f9;';
          html += '<tr>';
          html += '<td style="padding:10px 16px;' + bb + 'font-weight:600;color:#1e293b;">' + esc(personName(s.to)) + '</td>';
          html += '<td style="padding:10px 16px;' + bb + 'text-align:left;font-weight:800;color:#4f46e5;">' + money(s.amount) + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';

        html += '</div>';
      });
    }

    if (sortedExpenses.length) {
      html += '<div style="font-size:16px;font-weight:800;color:#1e293b;margin:28px 0 14px;padding-right:10px;border-right:4px solid #f59e0b;">🧾 تراکنش‌ها</div>';

      html += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;border:1px solid #e2e8f0;">';
      html += '<thead><tr style="background:#fffbeb;">';
      html += '<th style="padding:10px 8px;text-align:right;font-weight:700;color:#92400e;border-bottom:1px solid #fde68a;width:26px;">#</th>';
      html += '<th style="padding:10px 8px;text-align:right;font-weight:700;color:#92400e;border-bottom:1px solid #fde68a;width:105px;">عنوان</th>';
      html += '<th style="padding:10px 8px;text-align:right;font-weight:700;color:#92400e;border-bottom:1px solid #fde68a;width:80px;">پرداخت‌کننده</th>';
      html += '<th style="padding:10px 8px;text-align:right;font-weight:700;color:#92400e;border-bottom:1px solid #fde68a;">برای چه کسانی</th>';
      html += '<th style="padding:10px 8px;text-align:left;font-weight:700;color:#92400e;border-bottom:1px solid #fde68a;width:95px;">مبلغ</th>';
      html += '</tr></thead><tbody>';
      sortedExpenses.forEach(function (e, i) {
        var bens = (e.beneficiaryIds || []);
        var bensHtml = bens.length
          ? bens.map(function (id) {
              return '<span style="unicode-bidi:isolate;direction:rtl;white-space:nowrap;">' + esc(personName(id)) + '</span>';
            }).join('،&nbsp;')
          : '—';
        var last = i === sortedExpenses.length - 1;
        var bb = last ? '' : 'border-bottom:1px solid #f1f5f9;';
        html += '<tr>';
        html += '<td style="padding:9px 8px;' + bb + 'color:#94a3b8;font-weight:600;font-size:11px;">' + (i + 1) + '</td>';
        html += '<td style="padding:9px 8px;' + bb + 'font-weight:700;color:#1e293b;word-break:break-word;line-height:1.4;">' + esc(e.title) + '</td>';
        html += '<td style="padding:9px 8px;' + bb + 'font-weight:600;color:#4f46e5;word-break:break-word;line-height:1.4;">' + esc(personName(e.payerId)) + '</td>';
        html += '<td style="padding:9px 8px;' + bb + 'color:#64748b;word-break:break-word;line-height:1.4;">' + bensHtml + '</td>';
        html += '<td style="padding:9px 8px;' + bb + 'text-align:left;font-weight:800;color:#4f46e5;">' + money(e.amount) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }

    html += '<div style="margin-top:30px;padding-top:14px;border-top:1px solid #e2e8f0;text-align:center;font-size:10px;color:#94a3b8;">';
    html += 'ساخته شده با <b style="color:#6366f1;">دنگ‌یار</b>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function exportPDF() {
    if (!people.length) {
      showToast('ابتدا افراد را اضافه کنید');
      return;
    }

    var PDF_WIDTH = 794;
    var htmlContent = buildPdfHtml();
    var container = qs('#pdfContainer');

    document.body.style.overflow = '';
    container.innerHTML = htmlContent;
    container.classList.add('active');
    container.style.width = PDF_WIDTH + 'px';
    container.style.minWidth = PDF_WIDTH + 'px';
    container.style.maxWidth = PDF_WIDTH + 'px';

    var overlay = document.createElement('div');
    overlay.className = 'pdf-loading-overlay';
    overlay.innerHTML = '<div class="spinner"></div><div>📄 در حال ساخت PDF...</div>';
    document.body.appendChild(overlay);

    var cleanup = function () {
      container.classList.remove('active');
      container.innerHTML = '';
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    };

    var generate = function () {
      if (typeof window.html2pdf === 'undefined') {
        cleanup();
        printFallback(htmlContent);
        return;
      }

      var fullHeight = container.scrollHeight || 1123;
      var filename = 'dongyar-settlement-' + fileStamp() + '.pdf';

      var opt = {
        margin: 0,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false,
          width: PDF_WIDTH,
          height: fullHeight,
          windowWidth: PDF_WIDTH,
          windowHeight: fullHeight,
          x: 0, y: 0, scrollX: 0, scrollY: 0,
          onclone: function (clonedDoc) {
            try {
              var htmlEl = clonedDoc.documentElement;
              var bodyEl = clonedDoc.body;
              var el = clonedDoc.getElementById('pdfContainer');

              if (htmlEl) {
                htmlEl.setAttribute('dir', 'rtl');
                htmlEl.setAttribute('lang', 'fa');
                htmlEl.style.cssText =
                  'width:' + PDF_WIDTH + 'px !important;' +
                  'min-width:' + PDF_WIDTH + 'px !important;' +
                  'max-width:' + PDF_WIDTH + 'px !important;' +
                  'margin:0 !important;padding:0 !important;' +
                  'overflow:visible !important;background:#ffffff !important;';
              }
              if (bodyEl) {
                bodyEl.style.cssText =
                  'width:' + PDF_WIDTH + 'px !important;' +
                  'min-width:' + PDF_WIDTH + 'px !important;' +
                  'max-width:' + PDF_WIDTH + 'px !important;' +
                  'margin:0 !important;padding:0 !important;' +
                  'overflow:visible !important;background:#ffffff !important;' +
                  'direction:rtl !important;position:relative !important;';
              }
              if (el) {
                el.style.cssText =
                  'display:block !important;' +
                  'position:absolute !important;' +
                  'top:0 !important;left:0 !important;right:auto !important;' +
                  'width:' + PDF_WIDTH + 'px !important;' +
                  'min-width:' + PDF_WIDTH + 'px !important;' +
                  'max-width:' + PDF_WIDTH + 'px !important;' +
                  'margin:0 !important;padding:0 !important;' +
                  'box-sizing:border-box !important;' +
                  'background:#ffffff !important;' +
                  'direction:rtl !important;' +
                  'transform:none !important;';
              }
            } catch (e) { console.warn('onclone error:', e); }
          }
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] }
      };

      window.html2pdf()
        .set(opt)
        .from(container)
        .save()
        .then(function () {
          cleanup();
          showToast('✓ PDF دانلود شد');
        })
        .catch(function (err) {
          console.error('PDF error:', err);
          cleanup();
          printFallback(htmlContent);
        });
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready
        .then(function () { setTimeout(generate, 300); })
        .catch(function () { setTimeout(generate, 600); });
    } else {
      setTimeout(generate, 700);
    }
  }

  function printFallback(htmlContent) {
    var w = window.open('', '_blank');
    if (!w) {
      showToast('پنجره‌ی جدید مسدود شد. لطفاً اجازه بدهید.');
      return;
    }
    w.document.open();
    w.document.write(
      '<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8">' +
      '<title>گزارش تسویه - دنگ‌یار</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">' +
      '<style>' +
      '*{box-sizing:border-box} body{margin:0;padding:0;background:#fff;font-family:Vazirmatn,Tahoma,sans-serif;}' +
      '@page{size:A4;margin:10mm;}' +
      '@media print{ tr{page-break-inside:avoid;} }' +
      '</style></head><body>' + htmlContent + '</body></html>'
    );
    w.document.close();
    setTimeout(function () {
      try { w.focus(); w.print(); } catch (e) { console.error(e); }
    }, 700);
  }

  function handleClick(e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    switch (action) {
      case 'tab': switchTab(el.getAttribute('data-tab')); break;
      case 'open-add-expense': openModal(null); break;
      case 'add-person': addPerson(); break;
      case 'delete-person': deletePerson(id); break;
      case 'edit-expense': openModal(id); break;
      case 'delete-expense': deleteExpense(id); break;
      case 'close-modal': closeModal(); break;
      case 'save-expense': saveExpense(); break;
      case 'reset-all': resetAll(); break;
      case 'settle-done': settleDone(); break;
      case 'export-backup': exportBackup(); break;
      case 'import-backup': qs('#backupFile').click(); break;
      case 'export-pdf': exportPDF(); break;
      case 'select-payer': modalPayerId = id; renderChips(); break;
      case 'toggle-ben':
        if (modalBenIds.has(id)) modalBenIds.delete(id);
        else modalBenIds.add(id);
        renderChips();
        break;
      case 'toggle-all':
        var allSel = people.length > 0 && people.every(function (p) { return modalBenIds.has(p.id); });
        modalBenIds = allSel ? new Set() : new Set(people.map(function (p) { return p.id; }));
        renderChips();
        break;
    }
  }

  function handleKeydown(e) {
    if (e.key === 'Escape') {
      var bd = qs('#modalBackdrop');
      if (bd && bd.classList.contains('open')) closeModal();
    }
  }

  function setupAmountFormatting() {
    var inp = qs('#expAmount');
    if (!inp) return;
    inp.addEventListener('input', function () {
      var v = inp.value
        .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
        .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); })
        .replace(/[^\d]/g, '');
      inp.value = v ? Number(v).toLocaleString('en-US') : '';
    });
  }

  function setupPersonInput() {
    var inp = qs('#personName');
    if (!inp) return;
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addPerson(); }
    });
  }

  function setupBackdrop() {
    var bd = qs('#modalBackdrop');
    if (!bd) return;
    bd.addEventListener('click', function (e) {
      if (e.target === bd) closeModal();
    });
  }

  function setupBackupFile() {
    var inp = qs('#backupFile');
    if (!inp) return;
    inp.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (file) importBackup(file);
      inp.value = '';
    });
  }

  function setupNetworkIndicator() {
    var bar = qs('#offlineBar');
    if (!bar) return;
    function update() {
      if (navigator.onLine) bar.classList.remove('show');
      else bar.classList.add('show');
    }
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  }

  function setupServiceWorker() {
    try {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol === 'file:') return;

      var hasReset = false;
      try {
        hasReset = (window.location.search || '').indexOf('reset_sw=1') !== -1;
      } catch (e) { hasReset = false; }

      if (hasReset) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          return caches.keys();
        }).then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).then(function () {
          window.location.replace(window.location.pathname);
        }).catch(function (err) {
          console.warn('reset error:', err);
        });
        return;
      }

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
          .then(function (reg) {
            console.log('Service Worker ثبت شد:', reg.scope);
          })
          .catch(function (err) {
            console.log('خطا در ثبت Service Worker:', err);
          });
      });
    } catch (err) {
      console.warn('setupServiceWorker error:', err);
    }
  }

  function init() {
    try {
      loadState();
      renderAll();

      requestPersistentStorage();

      document.addEventListener('click', handleClick, false);
      document.addEventListener('keydown', handleKeydown, false);
      setupAmountFormatting();
      setupPersonInput();
      setupBackdrop();
      setupBackupFile();
      setupNetworkIndicator();
      setupServiceWorker();
      console.log('dongyar initialized ✓');
    } catch (err) {
      console.error('dongyar init error:', err);
      alert('خطا در راه‌اندازی برنامه: ' + err.message);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
